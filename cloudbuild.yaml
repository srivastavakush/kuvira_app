# Google Cloud Build — build, push to Artifact Registry, deploy to Cloud Run.
# Trigger from GitHub on push to main (production) or a staging branch.
substitutions:
  _REGION: asia-south1
  _REPO: kuvira
  _SERVICE: kuvira-api
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA
      - backend
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8001
      - --cpu=1
      - --memory=512Mi
      - --concurrency=40
      - --timeout=60
      - --min-instances=0
      - --max-instances=10
      - --set-env-vars=APP_ENV=production,DB_NAME=kuvira_sports,OTP_PROVIDER=twilio
      - --set-secrets=JWT_SECRET=JWT_SECRET:latest,MONGO_URL=MONGO_URL:latest,EMERGENT_LLM_KEY=EMERGENT_LLM_KEY:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,TWILIO_VERIFY_SERVICE=TWILIO_VERIFY_SERVICE:latest
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
